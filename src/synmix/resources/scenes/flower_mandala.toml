name = "FlowerMandala"
fragment_shader_filename = "flower_mandala.glsl"

[[params]]
name = "CHAR_C"
button = "FX1_ADVENCED"
controller.type = "ToggleController"
# ! (Exclamation)

[[params]]
name = "CHAR_L"
button = "FX1_DRY_WET_BTN"
controller.type = "ToggleController"
# @ (At)

[[params]]
name = "CHAR_M"
button = "R_IN_ADJUST"
controller.type = "ToggleController"
