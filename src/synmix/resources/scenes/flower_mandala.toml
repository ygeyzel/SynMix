name = "FlowerMandala"
fragment_shader_filename = "flower_mandala.glsl"

[[params]]
name = "CHAR_C"
button = ["clickables", 23]
controller.type = "ToggleController"
# ! (Exclamation)

[[params]]
name = "CHAR_L"
button = ["clickables", 24]
controller.type = "ToggleController"
# @ (At)

[[params]]
name = "CHAR_M"
button = ["clickables", 25]
controller.type = "ToggleController"
# # (Pound)

[[params]]
name = "time"
button = ["scrollers", 0]
controller.type = "RangedController"
controller.args = {step = 0.1, min_value = 0, max_value = 1000000, initial_value = 0}
# up down

[[params]]
name = "floatColorControler"
button = ["scrollers", 1]
controller.type = "CyclicController"
controller.args = {step = 0.3, min_value = -60, max_value = 22, initial_value = 0}
# left right


[[params]]
name = "lightness"
button = ["knobs", 8]
controller.type = "NormalizedController"
controller.args = { min_value = -4, max_value = 4, initial_value = 0}

[[params]]
name = "scaleControler"
button = ["scrollers", 4]
controller.type = "RangedController"
controller.args = {step = 0.1, min_value = 0.5, max_value = 20.0, initial_value = 2.0}
# A S



[[params]]
name = "fraction"
button = ["scrollers", 5]
controller.type = "RangedController"
controller.args = {step = 1, min_value = 0, max_value = 200, initial_value = 7}
# O P


[[params]]
name = "floatColorFraction"
button = ["knobs", 9]
controller.type = "NormalizedController"
controller.args = {min_value = 0, max_value = 20, initial_value = 20}
# D F


[[params]]
name = "floatLeafNumber"
button = ["knobs", 0]
controller.type = "NormalizedController"
controller.args = {min_value = 0, max_value = 7, initial_value = 0}
# T Y


[[params]]
name = "anotherColorControler"
button = ["knobs", 1]
controller.type = "NormalizedController"
controller.args = {min_value = 0.2, max_value = 20.0, initial_value = 10.0}
# G H


[[params]]
name = "lineWidth"
button = ["knobs", 2]
controller.type = "NormalizedController"
controller.args = {min_value = 0.0, max_value = 0.9, initial_value = 0.7}
# V B
# requaier CHAR_L to be true (@)

[[params]]
name = "mouseX"
button = ["knobs", 3]
controller.type = "NormalizedController"
controller.args = {min_value = 0.0, max_value = 1.0, initial_value = 0.0}
# U I
# 0 = no mouse

[[params]]
name = "mouseY"
button = ["knobs", 4]
controller.type = "NormalizedController"
controller.args = {min_value = 0.0, max_value = 1.0, initial_value = 0.5}
# J K
