[[params]]
name = "time"
button = "L_WEEL"
controller.type = "RangedController"
controller.args = {step = 0.1, min_value = 0, max_value = 1000000, initial_value = 0}
# up down

[[params]]
name = "floatColorControler"
button = "R_WEEL"
controller.type = "CyclicController"
controller.args = {step = 0.3, min_value = -60, max_value = 22, initial_value = 0}
# left right


[[params]]
name = "lightness"
button = "A_GAIN"
controller.type = "NormalizedController"
controller.args = { min_value = -4, max_value = 4, initial_value = 0}

[[params]]
name = "scaleControler"
button = "L_WEEL_SCRETCH"
controller.type = "RangedController"
controller.args = {step = 0.1, min_value = 0.5, max_value = 20.0, initial_value = 2.0}
# A S



[[params]]
name = "fraction"
button = "R_MOVE_GRID"
controller.type = "RangedController"
controller.args = {step = 1, min_value = 0, max_value = 200, initial_value = 7}
# O P


[[params]]
name = "floatColorFraction"
button = "L_FILTER"
controller.type = "NormalizedController"
controller.args = {min_value = 0, max_value = 20, initial_value = 20}
# D F


[[params]]
name = "floatLeafNumber"
button = "A_HI"
controller.type = "NormalizedController"
controller.args = {min_value = 0, max_value = 7, initial_value = 0}
