controller.type = "NormalizedController"
controller.args = { min_value = 0.0, max_value = 2.0, initial_value = 1.0 }

[[params]]
name = "skyColorR"
button = "B_HI"
controller.type = "NormalizedController"
controller.args = { min_value = 0.0, max_value = 1.0, initial_value = 0.25 }

[[params]]
name = "skyColorG"
