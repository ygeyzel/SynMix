name = "DesertDunes"
fragment_shader_filename = "desert_dunes.glsl"

[[params]]
name = "timeSpeed"
button = "L_WEEL"
controller.type = "CyclicController"
controller.args = { step = 0.01, min_value = 0.0, max_value = 2.0 }

[[params]]
name = "cameraSpeed"
button = "R_WEEL"
controller.type = "CyclicController"
controller.args = { step = 0.01, min_value = 0.0, max_value = 10.0 }

[[params]]
name = "cameraHeight"
button = "A_HI"
controller.type = "NormalizedController"
controller.args = { min_value = -0.5, max_value = 1.0, initial_value = 0.05 }

[[params]]
name = "horizonShift"
button = "A_MID"
controller.type = "NormalizedController"
controller.args = { min_value = -1.0, max_value = 1.0, initial_value = 0.2 }

[[params]]
name = "sunSize"
button = "A_LOW"
controller.type = "NormalizedController"
controller.args = { min_value = 0.5, max_value = 3.0, initial_value = 1.0 }

[[params]]
name = "sunRotationSpeed"
button = "L_FILTER"
controller.type = "NormalizedController"
controller.args = { min_value = 0.0, max_value = 3.0, initial_value = 1.0 }

[[params]]
name = "sunOrbit"
button = "B_GAIN"
controller.type = "NormalizedController"
controller.args = { min_value = 0.0, max_value = 1.0, initial_value = 0.4 }

[[params]]
name = "sunPulse"
button = "HEADPHONES_MIX"
controller.type = "NormalizedController"
controller.args = { min_value = 0.0, max_value = 3.0, initial_value = 1.0 }

[[params]]
name = "duneScale"
button = "C_GAIN"
controller.type = "NormalizedController"
controller.args = { min_value = 0.2, max_value = 3.0, initial_value = 1.0 }

[[params]]
name = "duneHeight"
button = "D_GAIN"
controller.type = "NormalizedController"
controller.args = { min_value = 0.0, max_value = 1.0, initial_value = 0.3 }

[[params]]
name = "sphereDensity"
button = "A_GAIN"
controller.type = "NormalizedController"
controller.args = { min_value = 0.0, max_value = 0.1, initial_value = 0.025 }

[[params]]
name = "fogDensity"
button = "R_FILTER"
controller.type = "NormalizedController"
controller.args = { min_value = 0.0, max_value = 0.5, initial_value = 0.05 }

[[params]]
name = "colorTint"
