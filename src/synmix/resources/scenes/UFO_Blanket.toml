name = "UFO Blanket"
fragment_shader_filename = "UFO_Blanket.glsl"

[[params]]
name = "xOffset"
button = "L_WEEL"
controller.type = 'CyclicController'
controller.args = { step = 0.01, min_value = -0.8, max_value = 0.8 }

[[params]]
name = "yOffset"
button = "R_WEEL"
controller.type = "CyclicController"
controller.args = { step = 0.01, min_value = -0.8, max_value = 0.8 }

[[params]]
name = "brightness"
button = "A_MID"
controller.type = "NormalizedController"
controller.args = { min_value = -1.0, max_value = 0.4, initial_value = -0.3 }

[[params]]
name = "smoothness"
button = "B_MID"
controller.type = "NormalizedController"
controller.args = { min_value = 0.7, max_value = 10.5, initial_value = 5.0 }

[[params]]
name = "zoom0"
button = "C_GAIN"
controller.type = "LinearSegmentedController"
controller.args = { segments_points = [[0.0, 0.8], [64.0, 3.0], [127.0, 20.0]], initial_value = 3.0 }

[[params]]
name = "zoom1"
button = "D_GAIN"
controller.type = "LinearSegmentedController"
controller.args = { segments_points = [[0.0, 0.8], [64.0, 3.0], [127.0, 20.0]], initial_value = 3.0 }

