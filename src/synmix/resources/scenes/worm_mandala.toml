name = "worm_mandala"
fragment_shader_filename = "worm_mandala.glsl"



[[params]]
name = "CHAR_C"
button = ["clickables", 23]
controller.type = "ToggleController"
# ! (Exclamation)

[[params]]
name = "CHAR_L"
button = ["clickables", 24]
controller.type = "ToggleController"
# @ (At)

[[params]]
name = "CHAR_A"
button = ["clickables", 25]
controller.type = "ToggleController"
# # (Pound)


[[params]]
name = "CHAR_X"
button = ["clickables", 26]
controller.type = "ToggleController"
# $ (Dollar)

[[params]]
name = "time"
button = ["scrollers", 0]
controller.type = "RangedController"
controller.args = {step = 0.1, min_value = 0, max_value = 1000000, initial_value = 0}
# up down


[[params]]
name = "rController"
button = ["scrollers", 1]
controller.type = "CyclicController"
controller.args = {step = 0.2, min_value = -30.0, max_value = 30.0, initial_value = 10.0}
# left right


[[params]]
name = "floatFragmentColor"
button = ["knobs", 11]
controller.type = "NormalizedController"
controller.args = {step = 1, min_value = 0, max_value = 40, initial_value = 20}
# . /


[[params]]
name = "lineWidth"
button = ["knobs", 2]
controller.type = "NormalizedController"
controller.args = {min_value = 0.0, max_value = 0.6, initial_value = 0.01}
# V B
# requaier CHAR_L to be true (@) or
# requaier CHAR_C to be true (!)


[[params]]
name = "lightness"
button = ["knobs", 8]
controller.type = "NormalizedController"
controller.args = {step = 0.1, min_value = -15.0, max_value = 4.0, initial_value = 0.0}
# E R


[[params]]
name = "colerShade"
button = ["knobs", 9]
controller.type = "NormalizedController"
controller.args = {min_value = 0.001, max_value = 20, initial_value = 0.4545}
# D F

[[params]]
name = "scale"
button = ["knobs", 0]
controller.type = "NormalizedController"
controller.args = {min_value = 0.001, max_value = 20, initial_value = 4.0}
# T Y


[[params]]
name = "floatBrightness"
button = ["knobs", 1]
controller.type = "NormalizedController"
controller.args = {min_value = -6, max_value = 6, initial_value = 0}
# G H

[[params]]
name = "mouseX"
button = ["knobs", 3]
controller.type = "NormalizedController"
controller.args = {min_value = 0.0, max_value = 1.0, initial_value = 0.0}
# U I
# 0 = no mouse

[[params]]
name = "mouseY"
button = ["knobs", 4]
controller.type = "NormalizedController"
controller.args = {min_value = 0.0, max_value = 1.0, initial_value = 0.5}
# J K
