name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Mesa (software OpenGL) and Xvfb
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1-mesa-dri xvfb
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv sync --locked
      - name: Smoke test
        # importing pyglet.window opens a display
        run: xvfb-run -a uv run synmix --help
      - run: uv run pytest -v
